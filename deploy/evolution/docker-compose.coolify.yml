# Evolution API no Coolify (servidor Hetzner) — com Postgres próprio, sem Caddy.
# Coolify › Projeto › + New › Docker Compose Empty → cole este arquivo.
# O Coolify cria o domínio (SERVICE_FQDN_*) e gera as senhas (SERVICE_PASSWORD_*)
# sozinho; o HTTPS fica com o proxy dele (Traefik). Veja docs/deploy-coolify.md.
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    environment:
      - SERVICE_FQDN_EVOLUTION_8080
      # Endereço público com https:// (o mesmo de Domains). Usado nos links de mídia.
      - SERVER_URL=https://whatsapp.kreativ.ae
      # "Chave da API" que vai no CRM (Admin › Configurações › WhatsApp)
      - AUTHENTICATION_API_KEY=$SERVICE_PASSWORD_64_EVOLUTION
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      # Guarda o histórico que o celular manda ao reconectar: o CRM recupera o que chegou enquanto estava fora
      - DATABASE_SAVE_DATA_HISTORIC=true
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=CRM Carlos Amâncio
      - CONFIG_SESSION_PHONE_NAME=Chrome
      # Versão do WhatsApp Web (web.whatsapp.com › Configurações › Ajuda). Se o QR code/código parar
      # de conectar, o WhatsApp atualizou: troque aqui pela versão nova e faça o Redeploy.
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1051310411
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  evolution_instances:
  evolution_postgres:
